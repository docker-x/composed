name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Gate: run full test suite before releasing
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -shuffle=on ./...

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Trigger pkg.go.dev to index the new version
  publish-go-module:
    name: Publish Go Module
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger pkg.go.dev indexing
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          url="https://proxy.golang.org/github.com/docker-x/composed/@v/${tag}.info"
          echo "Requesting: $url"
          curl -sf "$url" || echo "pkg.go.dev will index on next fetch"
