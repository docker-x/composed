name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -shuffle=on ./...

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          npx -p semantic-release@25.0.9 \
              -p @semantic-release/changelog@7.0.0 \
              -p @semantic-release/exec@7.1.0 \
              -p @semantic-release/git@11.0.1 \
              semantic-release

      - name: Publish Go module
        if: steps.semantic.outcome == 'success'
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -n "$tag" ]; then
            url="https://proxy.golang.org/github.com/docker-x/composed/@v/${tag}.info"
            echo "Requesting: $url"
            curl -sf "$url" || echo "pkg.go.dev will index on next fetch"
          else
            echo "No release tag on HEAD; skipping pkg.go.dev ping"
          fi
